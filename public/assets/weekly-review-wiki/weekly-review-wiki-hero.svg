<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Weekly Review Wiki publishing system</title><desc id="desc">Stylized personal operating system wiki with weekly cards, schema checks, and publishing pipeline.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".48" stop-color="#eef2ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1e293b" flood-opacity=".2"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1240" cy="250" r="260" fill="#c4b5fd" opacity=".35"/><circle cx="250" cy="820" r="310" fill="#67e8f9" opacity=".38"/><rect x="170" y="120" width="1260" height="760" rx="54" fill="#ffffff" filter="url(#s)"/><rect x="230" y="190" width="1080" height="110" rx="34" fill="url(#a)"/><text x="285" y="260" fill="#fff" font-family="Inter, ui-sans-serif, system-ui" font-size="42" font-weight="900">Weekly Review Wiki</text><text x="235" y="375" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="48" font-weight="900">A schema-gated personal review archive</text><text x="235" y="428" fill="#475569" font-family="Inter, ui-sans-serif, system-ui" font-size="28">Weekly reflections become durable, browsable, human-designed pages.</text><g font-family="Inter, ui-sans-serif, system-ui"><rect x="240" y="505" width="315" height="250" rx="34" fill="#eff6ff" stroke="#bfdbfe" stroke-width="4"/><text x="285" y="570" fill="#1d4ed8" font-size="30" font-weight="900">Input</text><text x="285" y="625" fill="#0f172a" font-size="28" font-weight="800">review notes</text><text x="285" y="670" fill="#475569" font-size="22">wins · friction · goals</text><rect x="642" y="505" width="315" height="250" rx="34" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="4"/><text x="687" y="570" fill="#6d28d9" font-size="30" font-weight="900">Schema</text><text x="687" y="625" fill="#0f172a" font-size="28" font-weight="800">frontmatter gates</text><text x="687" y="670" fill="#475569" font-size="22">typed content model</text><rect x="1044" y="505" width="315" height="250" rx="34" fill="#ecfeff" stroke="#a5f3fc" stroke-width="4"/><text x="1089" y="570" fill="#0e7490" font-size="30" font-weight="900">Publish</text><text x="1089" y="625" fill="#0f172a" font-size="28" font-weight="800">wiki archive</text><text x="1089" y="670" fill="#475569" font-size="22">fast static Astro pages</text></g><text x="240" y="825" fill="#334155" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="800">Astro · Zod · content collections · automation · personal knowledge ops</text></svg>