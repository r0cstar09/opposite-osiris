<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Spanish Active Timed Recall app hero graphic</title>
  <desc id="desc">A stylized dashboard showing Spanish sentence practice, timed recall, verb drills, and review queue signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1320" cy="160" r="250" fill="#fed7aa" opacity="0.42"/>
  <circle cx="180" cy="850" r="290" fill="#bfdbfe" opacity="0.55"/>
  <rect x="170" y="130" width="1260" height="740" rx="54" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="170" y="130" width="1260" height="108" rx="54" fill="#0f172a"/>
  <circle cx="230" cy="184" r="14" fill="#f87171"/>
  <circle cx="274" cy="184" r="14" fill="#facc15"/>
  <circle cx="318" cy="184" r="14" fill="#4ade80"/>
  <text x="392" y="198" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="700">Spanish Active Timed Recall</text>

  <rect x="235" y="300" width="520" height="360" rx="34" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/>
  <text x="280" y="360" fill="#9a3412" font-family="Inter, ui-sans-serif, system-ui" font-size="30" font-weight="800">Sentence sprint</text>
  <text x="280" y="426" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="48" font-weight="900">“I used to…”</text>
  <text x="280" y="488" fill="#475569" font-family="Inter, ui-sans-serif, system-ui" font-size="28">Produce Spanish under timer pressure.</text>
  <rect x="280" y="542" width="330" height="26" rx="13" fill="#fed7aa"/>
  <rect x="280" y="542" width="238" height="26" rx="13" fill="#f97316"/>
  <text x="280" y="618" fill="#9a3412" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700">Accuracy · latency · misses</text>

  <rect x="830" y="300" width="500" height="150" rx="30" fill="#eff6ff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="880" y="360" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="800">Review queue</text>
  <text x="880" y="410" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="38" font-weight="900">Misses return until sealed</text>

  <rect x="830" y="500" width="500" height="150" rx="30" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="4"/>
  <text x="880" y="560" fill="#15803d" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="800">Verb trainer</text>
  <text x="880" y="610" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="38" font-weight="900">Full-grid conjugation practice</text>

  <rect x="235" y="715" width="1095" height="86" rx="30" fill="url(#accent)"/>
  <text x="285" y="770" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="900">Ear-first learning · active recall · FSRS-style review · Tailnet-backed API</text>
</svg>
