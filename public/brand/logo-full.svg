<svg width="760" height="220" viewBox="0 0 760 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tony Muzo — Security &amp; Threat Intelligence">
	<defs>
		<linearGradient id="lfEdge" x1="24" y1="38" x2="232" y2="218" gradientUnits="userSpaceOnUse">
			<stop stop-color="#41d8ff"/>
			<stop offset="0.5" stop-color="#5aa7ff"/>
			<stop offset="1" stop-color="#a495ff"/>
		</linearGradient>
		<linearGradient id="lfFill" x1="76" y1="38" x2="180" y2="218" gradientUnits="userSpaceOnUse">
			<stop stop-color="#0d1626"/>
			<stop offset="1" stop-color="#04060b"/>
		</linearGradient>
		<linearGradient id="lfChevron" x1="80" y1="92" x2="124" y2="164" gradientUnits="userSpaceOnUse">
			<stop stop-color="#7fe6ff"/>
			<stop offset="1" stop-color="#41d8ff"/>
		</linearGradient>
		<linearGradient id="lfWord" x1="470" y1="70" x2="720" y2="140" gradientUnits="userSpaceOnUse">
			<stop stop-color="#41d8ff"/>
			<stop offset="1" stop-color="#a495ff"/>
		</linearGradient>
	</defs>

	<!-- Mark -->
	<g transform="translate(6,-18) scale(0.8)">
		<path d="M232 128 L180 218 L76 218 L24 128 L76 38 L180 38 Z"
			fill="url(#lfFill)" stroke="url(#lfEdge)" stroke-width="6" stroke-linejoin="round"/>
		<path d="M215 128 L172 202 L84 202 L41 128 L84 54 L172 54 Z"
			fill="none" stroke="#41d8ff" stroke-width="1.5" opacity="0.16"/>
		<path d="M80 92 L124 128 L80 164" fill="none" stroke="url(#lfChevron)"
			stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
		<rect x="136" y="148" width="42" height="17" rx="5" fill="#a495ff"/>
		<circle cx="232" cy="128" r="5" fill="#41d8ff"/>
		<circle cx="24" cy="128" r="5" fill="#41d8ff"/>
	</g>

	<!-- Wordmark -->
	<text x="222" y="112" font-family="'Chakra Petch', system-ui, sans-serif"
		font-weight="700" font-size="66" letter-spacing="1">
		<tspan fill="#f1f5fb">TONY</tspan><tspan dx="20" fill="url(#lfWord)">MUZO</tspan>
	</text>
	<text x="224" y="152" font-family="'JetBrains Mono', ui-monospace, monospace"
		font-weight="500" font-size="18" letter-spacing="4" fill="#8a99b4">
		// SECURITY · THREAT INTELLIGENCE
	</text>
