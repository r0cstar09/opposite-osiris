<svg width="760" height="220" viewBox="0 0 760 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tony Muzo — Security &amp; Threat Intelligence">
	<defs>
		<linearGradient id="llEdge" x1="24" y1="38" x2="232" y2="218" gradientUnits="userSpaceOnUse">
			<stop stop-color="#0ea5e9"/>
			<stop offset="0.5" stop-color="#2563eb"/>
			<stop offset="1" stop-color="#6d28d9"/>
		</linearGradient>
		<linearGradient id="llFill" x1="76" y1="38" x2="180" y2="218" gradientUnits="userSpaceOnUse">
			<stop stop-color="#0d1626"/>
			<stop offset="1" stop-color="#04060b"/>
		</linearGradient>
		<linearGradient id="llChevron" x1="80" y1="92" x2="124" y2="164" gradientUnits="userSpaceOnUse">
			<stop stop-color="#5ad0ff"/>
			<stop offset="1" stop-color="#0ea5e9"/>
		</linearGradient>
		<linearGradient id="llWord" x1="470" y1="70" x2="720" y2="140" gradientUnits="userSpaceOnUse">
			<stop stop-color="#0369a1"/>
			<stop offset="1" stop-color="#6d28d9"/>
		</linearGradient>
	</defs>

	<!-- Mark -->
	<g transform="translate(6,-18) scale(0.8)">
		<path d="M232 128 L180 218 L76 218 L24 128 L76 38 L180 38 Z"
