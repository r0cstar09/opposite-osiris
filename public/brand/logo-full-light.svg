		<path d="M80 92 L124 128 L80 164" fill="none" stroke="url(#llChevron)"
			stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
		<rect x="136" y="148" width="42" height="17" rx="5" fill="#a495ff"/>
		<circle cx="232" cy="128" r="5" fill="#0ea5e9"/>
		<circle cx="24" cy="128" r="5" fill="#0ea5e9"/>
	</g>

	<!-- Wordmark -->
	<text x="222" y="112" font-family="'Chakra Petch', system-ui, sans-serif"
		font-weight="700" font-size="66" letter-spacing="1">
		<tspan fill="#0c1626">TONY</tspan><tspan dx="20" fill="url(#llWord)">MUZO</tspan>
	</text>
	<text x="224" y="152" font-family="'JetBrains Mono', ui-monospace, monospace"
		font-weight="500" font-size="18" letter-spacing="4" fill="#5f6d87">
