<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tony Muzo operator sigil">
	<defs>
		<linearGradient id="tmEdge" x1="24" y1="38" x2="232" y2="218" gradientUnits="userSpaceOnUse">
			<stop stop-color="#41d8ff"/>
			<stop offset="0.5" stop-color="#5aa7ff"/>
			<stop offset="1" stop-color="#a495ff"/>
		</linearGradient>
		<linearGradient id="tmFill" x1="76" y1="38" x2="180" y2="218" gradientUnits="userSpaceOnUse">
			<stop stop-color="#0d1626"/>
			<stop offset="1" stop-color="#04060b"/>
		</linearGradient>
		<linearGradient id="tmChevron" x1="80" y1="92" x2="124" y2="164" gradientUnits="userSpaceOnUse">
			<stop stop-color="#7fe6ff"/>
			<stop offset="1" stop-color="#41d8ff"/>
		</linearGradient>
		<filter id="tmGlow" x="-30%" y="-30%" width="160%" height="160%">
			<feGaussianBlur stdDeviation="5" result="b"/>
			<feMerge>
				<feMergeNode in="b"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<!-- Soft outer glow of the hex silhouette -->
	<path d="M232 128 L180 218 L76 218 L24 128 L76 38 L180 38 Z"
		fill="none" stroke="url(#tmEdge)" stroke-width="3" opacity="0.35" filter="url(#tmGlow)"/>

	<!-- Hex body -->
	<path d="M232 128 L180 218 L76 218 L24 128 L76 38 L180 38 Z"
		fill="url(#tmFill)" stroke="url(#tmEdge)" stroke-width="6"
		stroke-linejoin="round"/>

	<!-- Inner hairline for depth -->
	<path d="M215 128 L172 202 L84 202 L41 128 L84 54 L172 54 Z"
		fill="none" stroke="#41d8ff" stroke-width="1.5" opacity="0.16"/>

	<!-- Terminal prompt: chevron -->
	<path d="M80 92 L124 128 L80 164" fill="none" stroke="url(#tmChevron)"
		stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#tmGlow)"/>

	<!-- Terminal prompt: blinking cursor block -->
	<rect x="136" y="148" width="42" height="17" rx="5" fill="#a495ff" filter="url(#tmGlow)"/>

	<!-- HUD vertex nodes -->
	<circle cx="232" cy="128" r="5" fill="#41d8ff"/>
	<circle cx="24" cy="128" r="5" fill="#41d8ff"/>
	<circle cx="180" cy="38" r="4" fill="#a495ff" opacity="0.9"/>
	<circle cx="76" cy="218" r="4" fill="#a495ff" opacity="0.9"/>
</svg>
